<!DOCTYPE html>
<html lang="ru" class="no-js">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta name="theme-color" content="#0b0b0a"/>
  <meta name="robots" content="noindex"/>
  <title>404 — страница не найдена</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body class="grain antialiased">
  <main class="relative flex min-h-[100svh] flex-col bg-paper text-ink">
    <div class="mx-auto flex w-full max-w-[1500px] flex-1 flex-col px-5 py-8 sm:px-8">
      <a href="./" class="flex items-center gap-2.5" aria-label="На главную">
        <svg width="26" height="22" viewBox="0 0 26 22" aria-hidden="true">
          <path d="M2 2 L13 9 L24 2" fill="none" stroke="currentColor" stroke-width="3.4"/>
          <path d="M2 10 L13 17 L24 10" fill="none" stroke="#1ec15e" stroke-width="3.4"/>
        </svg>
        <span class="font-mono text-[15px] font-bold tracking-[0.14em]">1941·1945</span>
      </a>

      <div class="flex flex-1 flex-col justify-center py-20">
        <p class="mono-label flex items-center gap-3 text-smoke"><span class="dot-live"></span> ОШИБКА 404</p>
        <h1 class="headline mt-6 text-[clamp(2.6rem,8vw,7rem)]">
          Такой страницы<br/><span class="text-smoke">нет в хронике.</span>
        </h1>
        <p class="mt-8 max-w-lg border border-dashed border-ink/25 p-5 text-[15.5px] leading-relaxed opacity-70">
          Возможно, ссылка устарела или в адресе опечатка. Вернитесь на главную — там вся хроника
          Великой Отечественной войны: 1941 → 1945.
        </p>
        <div class="mt-9 flex flex-wrap gap-3">
          <a href="./" class="btn-solid"><span class="dot-live"></span> НА ГЛАВНУЮ</a>
          <a href="./#chronicle" class="btn-ghost">ХРОНИКА ВОЙНЫ</a>
        </div>
      </div>

      <div class="flex flex-wrap items-center justify-between gap-3 border-t border-ink/10 py-4">
        <span class="mono-label text-smoke">22.06.1941 — 02.09.1945</span>
        <span class="mono-label text-smoke">СССР • ЕВРОПА • АЗИЯ</span>
      </div>
    </div>
  </main>
</body>
</html>
